name: CI

# Reusable: called by cicd.yml so deploys only run once these checks pass.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # lib/env.ts validates at build time; CI builds against the local Supabase defaults.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

  database:
    name: Migrations, types, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Applies every migration plus seed.sql from scratch; fails if any of them break.
      - name: Start local Supabase
        run: npx supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Lint database schema
        run: npm run db:lint

      # pgTAP tests in supabase/tests/database: RLS, grants, functions and Storage policies.
      - name: Test database
        run: npm run db:test

      - name: Check generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code types/database.ts || {
            echo "::error file=types/database.ts::Generated types are stale. Run 'npm run db:types' and commit the result."
            exit 1
          }

      - name: Build
        run: |
          cp .env.example .env.local
          npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

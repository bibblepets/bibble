<!doctype html>
<html lang="en">
	<body
		style="
			margin: 0;
			padding: 32px 16px;
			background: #f5f7fa;
			font-family: Helvetica, Arial, sans-serif;
			color: #1a1a1a;
		"
	>
		<table
			role="presentation"
			width="100%"
			cellpadding="0"
			cellspacing="0"
			style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px"
		>
			<tr>
				<td style="padding: 32px">
					<p style="margin: 0 0 24px; font-size: 24px; font-weight: 700; color: #0ea9ee">bibble</p>
					<h1 style="margin: 0 0 12px; font-size: 20px">Reset your password</h1>
					<p style="margin: 0 0 24px; line-height: 1.5">
						We received a request to reset the password for your Bibble account.
					</p>
					<a
						href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
						style="
							display: inline-block;
							padding: 12px 20px;
							border-radius: 8px;
							background: #0077b6;
							color: #ffffff;
							font-weight: 600;
							text-decoration: none;
						"
						>Choose a new password</a
					>
					<p style="margin: 24px 0 0; font-size: 13px; line-height: 1.5; color: #666666">
						If you didn't ask to reset your password, you can ignore this email. Your password won't change.
					</p>
				</td>
			</tr>
		</table>
	</body>
</html>
